<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>三更之约</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#ccc;font-family:SimSun,Microsoft YaHei,serif;height:100vh;overflow:hidden;user-select:none;display:flex;justify-content:center}
#G{width:100%;max-width:1100px;height:100vh;display:none;flex-direction:column;background:#121212}

.rt{position:absolute;top:12px;left:20px;z-index:40;font-size:.85rem;color:rgba(255,255,255,.25);letter-spacing:.3em;pointer-events:none}

.ex:hover{color:#f66;border-color:rgba(200,50,50,.7);background:rgba(180,0,0,.12)}
#HB{display:flex;align-items:center;gap:10px;padding:12px 22px;background:#151515;border-bottom:1px solid #2a2a2a;min-height:48px;flex-shrink:0}

.nl{margin-bottom:3px;animation:fu .3s ease-out}.nl.r{color:#f44}.nl.d{color:#777;font-style:italic}.nl.g{color:#e8c070}
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
#IV{display:flex;align-items:center;gap:8px;padding:6px 22px;background:#121212;min-height:38px;flex-shrink:0}

.ic{width:38px;height:30px;background:#151515;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:.55rem;color:#666;cursor:pointer;transition:all .3s;border-radius:2px}
.ic.o{border-color:#5a2828;color:#b99;background:#1a0e0e}.ic:hover{border-color:rgba(200,50,50,.6)}
#MD{position:fixed;top:0;left:0;width:100%;height:100%;z-index:350;background:rgba(0,0,0,.95);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;animation:mdIn .3s ease-out}
#MD.on{display:flex}#MD img{max-width:84%;max-height:36vh;margin-bottom:14px;border:1px solid rgba(200,50,50,.3)}
@keyframes mdIn{from{opacity:0}to{opacity:1}}
.mt{color:#c22;font-size:1.3rem;letter-spacing:.2em;margin-bottom:10px}
.mb{font-size:.92rem;line-height:1.9;color:#bbb;max-width:520px}.mb .hl{color:#f44}
.mbtn{margin:6px 5px;padding:10px 28px;font-family:inherit;font-size:.88rem;color:#aaa;background:transparent;border:1px solid #444;cursor:pointer;letter-spacing:.1em;transition:all .3s}
.mbtn:hover{border-color:#c22;color:#fff;background:rgba(180,0,0,.15)}
.fx{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:90}
.shk{animation:sx .6s ease-out}@keyframes sx{0%,100%{transform:translateX(0)}10%{transform:translateX(-8px)}30%{transform:translateX(8px)}50%{transform:translateX(-4px)}70%{transform:translateX(4px)}90%{transform:translateX(-2px)}}
.flh{animation:fo .5s ease-out;background:rgba(150,0,0,.12)}@keyframes fo{from{opacity:1}to{opacity:0}}
.tp{position:absolute;top:10px;right:22px;z-index:20;font-size:.7rem;color:rgba(255,255,255,.12);pointer-events:none;animation:fu .4s ease-out}
.f1{background:linear-gradient(180deg,#3a3a3a,#252525 45%,#1e1e1e);border-radius:8px 8px 0 0;border:2px solid #444;box-shadow:0 -3px 8px rgba(0,0,0,.4) inset}
.f1::after{content:'';position:absolute;top:10px;left:10%;width:25%;height:28%;background:linear-gradient(180deg,#484848,#333);border-radius:6px;border:1px solid #4a4a4a}
.f2{background:linear-gradient(180deg,#3a3028,#282018);border-radius:4px;border:2px solid #3a3028;box-shadow:0 3px 6px rgba(0,0,0,.5)}
.f3{background:linear-gradient(180deg,#282828,#181818);border:2px solid #444;border-radius:3px;box-shadow:0 0 14px rgba(200,40,40,.3),0 0 4px rgba(200,30,30,.2) inset}
.f3::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:22%;height:10px;background:#2a2a2a;border-radius:0 0 3px 3px}
.f4{background:linear-gradient(90deg,#333,#282828 2%,#242424 50%,#282828 98%,#333);border:2px solid #444;border-radius:3px 3px 0 0;box-shadow:0 0 0 1px rgba(0,0,0,.3) inset}
.f4::after{content:'';position:absolute;top:0;left:50%;width:2px;height:100%;background:#4a4a4a}
.f5{background:linear-gradient(160deg,#383848,#1e1e2e 40%,#2a2a38);border:3px solid #444;border-radius:2px;box-shadow:0 0 24px rgba(30,30,60,.4) inset}
.f5::after{content:'';position:absolute;top:12%;left:18%;width:28%;height:35%;background:linear-gradient(160deg,rgba(220,220,250,.08),transparent);border-radius:2px}
.f6{background:linear-gradient(180deg,#3a2e24,#261e14);border:2px solid #3e342a;border-radius:5px 5px 0 0;box-shadow:0 0 0 2px rgba(0,0,0,.3) inset}
.f6::after{content:'';position:absolute;top:42%;right:10%;width:6px;height:6px;background:#555;border:1px solid #666;border-radius:50%}
.f7{background:linear-gradient(180deg,#181822,#0e0e16);border:2px solid #3a3a44;box-shadow:0 0 12px rgba(20,20,50,.5) inset}
.f8{background:#2e2820;border:2px solid #3e3428;border-radius:2px;box-shadow:0 3px 0 #342e24}
.f9{background:#333;border:2px solid #4a4a4a;transform:rotate(-3deg);box-shadow:0 0 6px rgba(0,0,0,.4)}
.fa{border-left:3px solid #444;border-right:2px solid #333;background:linear-gradient(90deg,rgba(30,30,30,.88),rgba(18,18,18,.92))}
.fb{background:#333;border:2px solid #444;border-radius:4px 4px 50% 50%}
.fc{background:#2e2620;border:2px solid #3e3428;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.3) inset}
.fd{background:linear-gradient(180deg,#333,#242424);border:2px solid #444;border-radius:5px 5px 0 0}
.fe{background:#222;border:2px solid #444;border-radius:3px}
.ff{background:radial-gradient(ellipse at center,#181818,#0a0a0a)}
.fg{background:linear-gradient(180deg,#282828,#181818);border:2px solid #444;border-radius:3px;box-shadow:0 0 6px rgba(120,120,140,.15) inset}
.fh{background:linear-gradient(180deg,#383838,#282828);border-radius:8px;border:2px solid #444}
.fi{background:linear-gradient(180deg,#383838,#242424);border:2px solid #444;border-radius:4px 4px 0 0}
.fj{background:#2e2820;border:2px solid #3e3428;border-radius:3px;box-shadow:0 3px 4px rgba(0,0,0,.4)}
.fk{background:#242424;border:2px solid #444;border-radius:6px}
.fl{background:#2a2418;border:2px solid #3e3420;border-radius:3px}
@media(max-width:600px){#NR{flex:0 0 75px;font-size:.78rem}#HT{font-size:.78rem}.il{font-size:.6rem}}
@keyframes spPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
</style></head><body>

<div id="TS" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:300;background:radial-gradient(ellipse at center,#0a0000,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden">
<div id="TSP" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"></div>
<div style="position:relative;z-index:2">
<div style="font-size:clamp(3rem,10vw,6rem);font-weight:900;letter-spacing:.5em;color:#8b0000;text-shadow:0 0 80px rgba(200,0,0,.7),0 0 160px rgba(139,0,0,.5);animation:tpulse 3s ease-in-out infinite;margin-bottom:12px">三更之约</div>
<div style="font-size:.95rem;color:#555;letter-spacing:.8em;margin-bottom:50px">T H E &nbsp; 3 &nbsp; A M &nbsp; P A C T</div>
<div style="font-size:.9rem;color:#777;margin-bottom:8px;animation:tsf 4s ease-in-out infinite">你没有受邀。</div>
<div style="font-size:1.1rem;color:#b33;margin-bottom:50px;letter-spacing:.2em;animation:tsf 4s ease-in-out 1s infinite">你 被 选 中 了。</div>
<button id="BT1" style="padding:16px 56px;font-family:inherit;font-size:1.05rem;color:#bbb;background:rgba(139,0,0,.06);border:1px solid #622;cursor:pointer;letter-spacing:.25em;border-radius:2px;margin:8px;transition:all .4s" onmouseover="this.style.borderColor='#c22';this.style.color='#fff';this.style.background='rgba(180,0,0,.15)';this.style.boxShadow='0 0 30px rgba(200,0,0,.3)'" onmouseout="this.style.borderColor='#622';this.style.color='#bbb';this.style.background='rgba(139,0,0,.06)';this.style.boxShadow='none'">开 始 游 戏</button>
<button id="BT2" style="padding:12px 40px;font-family:inherit;font-size:.9rem;color:#444;background:transparent;border:1px solid #222;cursor:pointer;letter-spacing:.2em;border-radius:2px;margin:4px;transition:all .3s" onmouseover="this.style.borderColor='#a33';this.style.color='#888'" onmouseout="this.style.borderColor='#222';this.style.color='#444'">继 续 游 戏</button>
<div style="margin-top:20px;display:flex;gap:12px;justify-content:center">
<button id="BTE" style="padding:8px 18px;font-family:inherit;font-size:.75rem;color:#555;background:transparent;border:1px solid #1a1a1a;cursor:pointer;letter-spacing:.1em;border-radius:2px;transition:all .3s" onmouseover="this.style.borderColor='#a33';this.style.color='#888'" onmouseout="this.style.borderColor='#1a1a1a';this.style.color='#555'">达成结局</button>
<button id="BTI" style="padding:8px 18px;font-family:inherit;font-size:.75rem;color:#555;background:transparent;border:1px solid #1a1a1a;cursor:pointer;letter-spacing:.1em;border-radius:2px;transition:all .3s" onmouseover="this.style.borderColor='#a33';this.style.color='#888'" onmouseout="this.style.borderColor='#1a1a1a';this.style.color='#555'">收集物品</button>
</div></div></div>
<style>@keyframes tpulse{0%,100%{text-shadow:0 0 80px rgba(200,0,0,.7),0 0 160px rgba(139,0,0,.5)}50%{text-shadow:0 0 120px rgba(240,0,0,.9),0 0 240px rgba(180,0,0,.7)}}@keyframes tsf{0%,100%{opacity:.4}50%{opacity:1}}@keyframes btGlow{0%,100%{box-shadow:0 0 10px rgba(200,150,30,.2)}50%{box-shadow:0 0 25px rgba(220,180,50,.5)}}.td{position:absolute;width:2px;height:60px;background:linear-gradient(180deg,transparent,rgba(139,0,0,.4),transparent);animation:tdF linear infinite}@keyframes tdF{0%{transform:translateY(-100px);opacity:0}10%{opacity:1}90%{opacity:.3}100%{transform:translateY(110vh);opacity:0}}</style>

<div id="G"><div id="SC"></div>
<div id="HB"><span id="HI">💡</span><span id="HT">看看电脑</span><span id="HD">任务</span></div>
<div id="NR"></div><div id="IV"><span id="IT">物 品</span></div></div>
<div class="fx" id="FX"></div><div id="MD"></div>

<script>
// ====== 状态 ======
var GS={room:'bedroom',phase:0,inv:[],fl:{},md:false,kd:false,cf:false,sf:false,sof:false,ph:false,ff:false,kf:false};
function save(){try{localStorage.setItem('s3y',JSON.stringify(GS))}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem('s3y'));if(d)Object.assign(GS,d)}catch(e){}}
function rst(){try{auStop();localStorage.removeItem('s3y')}catch(e){}location.reload()}
load();  if(GS.room==='outdoor'){GS.room='bedroom';GS.phase=0;GS.md=GS.kd=false;GS.fl={};GS.inv=[]}
var IMG='img/',AI={forum:IMG+'forum.png',mirror:IMG+'mirror.png',door:IMG+'door.png'};

// ====== 全局统计 ======
function gsGet(){try{return JSON.parse(localStorage.getItem('s3y_stats'))||{ends:[],items:[]}}catch(e){return{ends:[],items:[]}}}
function gsEnd(n){var s=gsGet();if(s.ends.indexOf(n)<0){s.ends.push(n);localStorage.setItem('s3y_stats',JSON.stringify(s))}}
function gsItem(n){var s=gsGet();if(s.items.indexOf(n)<0){s.items.push(n);localStorage.setItem('s3y_stats',JSON.stringify(s))}}
function gsSync(){if(GS.inv.length){var s=gsGet();GS.inv.forEach(function(i){if(s.items.indexOf(i.n)<0)s.items.push(i.n)});localStorage.setItem('s3y_stats',JSON.stringify(s))}}

// ====== 音效 ======
var AU={bgm:null,chm:null,ctx:null};
function auInit(){if(AU.ctx)return;try{AU.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){};AU.bgm=new Audio('sounds/bg_charm_and_rules.mp3');AU.bgm.loop=true;AU.bgm.volume=0.22;AU.chm=new Audio('sounds/chase_creepy_vibes.mp3');AU.chm.loop=true;AU.chm.volume=0}
function auPlay(){auInit();if(AU.bgm)AU.bgm.play().catch(function(){})}
function auStop(){if(AU.bgm){AU.bgm.pause();AU.bgm.currentTime=0}}
function auChase(){auInit();AU.bgm.pause();AU.chm.currentTime=0;AU.chm.volume=0;AU.chm.play().catch(function(){});var t=0,iv=setInterval(function(){t+=0.04;if(t>=1){clearInterval(iv);AU.chm.volume=0.3;return}AU.chm.volume=0.3*t},40)}
function auEndChase(){var t=0,iv=setInterval(function(){t+=0.04;if(t>=0.5){clearInterval(iv);AU.chm.pause();AU.chm.volume=0;AU.bgm.play().catch(function(){});AU.bgm.volume=0.22;return}AU.chm.volume=0.3*(1-t)},40)}
function sfx(t){auInit();if(!AU.ctx)return;var c=AU.ctx,n=c.currentTime,o,g;if(t==='flash'){o=c.createOscillator();g=c.createGain();o.type='sine';o.frequency.setValueAtTime(500,n);o.frequency.setValueAtTime(700,n+.02);g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.06);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+.06)}if(t==='shake'){o=c.createOscillator();g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(60,n);o.frequency.exponentialRampToValueAtTime(20,n+.4);g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.001,n+.5);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+.5)}if(t==='scare'){o=c.createOscillator();g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(800,n);o.frequency.exponentialRampToValueAtTime(80,n+.3);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.4);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+.4)}if(t==='spawn'){o=c.createOscillator();g=c.createGain();o.type='sine';o.frequency.value=120;g.gain.value=.025;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.1);o.stop(c.currentTime+.1)}if(t==='end'){o=c.createOscillator();g=c.createGain();o.type='sine';o.frequency.setValueAtTime(300,n);o.frequency.setValueAtTime(500,n+.2);o.frequency.setValueAtTime(800,n+.4);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.01,n+.8);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+.8)}}

// ====== UI工具 ======
function N(t,c){var p=document.getElementById('NR'),l=document.createElement('div');l.className='nl'+(c?' '+c:'');l.innerHTML=t;p.appendChild(l);p.scrollTop=p.scrollHeight}
function H(t){document.getElementById('HT').textContent=t}
function TP(t){var s=document.getElementById('SC'),e=document.createElement('div');e.className='tp';e.textContent=t;s.appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='opacity 1s';setTimeout(function(){e.remove()},1000)},2500)}
function FX(n){var f=document.getElementById('FX');if(n==='flash'){f.className='flh';setTimeout(function(){f.className=''},500)}if(n==='shake'){f.className='shk';setTimeout(function(){f.className=''},700)}sfx(n)}
function addInv(n,d){if(GS.inv.find(function(i){return i.n===n}))return;GS.inv.push({n:n,d:d});gsItem(n);refInv();N('获得「'+n+'」。','g');save()}
function refInv(){var r=document.getElementById('IV');r.innerHTML='<span id="IT">物 品</span>';GS.inv.forEach(function(it){var c=document.createElement('div');c.className='ic o';c.textContent=it.n.slice(0,2);c.title=it.d;c.onclick=function(){N('「'+it.n+'」：'+it.d,'d')};r.appendChild(c)});for(var i=GS.inv.length;i<6;i++){var c=document.createElement('div');c.className='ic';c.textContent='-';r.appendChild(c)}}
var MD_CB=[];
function mOpen(t,img,ls,cs){var m=document.getElementById('MD');m.classList.add('on');MD_CB=cs||[{t:'继续',a:function(){mClose()}}];var btns='';for(var i=0;i<MD_CB.length;i++)btns+='<button class="mbtn" onclick="MD_CB['+i+'].a()">'+MD_CB[i].t+'</button>';m.innerHTML='<div class="mt">'+t+'</div>'+(img?'<img src="'+img+'">':'')+'<div class="mb">'+ls.map(function(l){return'<p>'+l+'</p>'}).join('')+'</div><div>'+btns+'</div>'}
function mClose(){document.getElementById('MD').classList.remove('on')}
function endScr(tt,dd){auStop();gsSync();gsEnd(tt);document.getElementById('TS').style.display='none';document.getElementById('G').style.display='none';var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;animation:fu .8s ease-out';d.innerHTML='<div style="color:#8b0000;font-size:2.5rem;font-weight:900;letter-spacing:.2em;margin-bottom:20px;text-shadow:0 0 40px rgba(200,0,0,.5)">'+tt+'</div><div style="color:#888;font-size:1rem;line-height:2;max-width:480px;margin-bottom:40px">'+dd+'</div><button style="padding:14px 40px;font-family:inherit;font-size:1rem;color:#aaa;background:transparent;border:1px solid #444;cursor:pointer;letter-spacing:.15em;transition:all .3s" onmouseover="this.style.borderColor=\'#c22\';this.style.color=\'#fff\'" onmouseout="this.style.borderColor=\'#444\';this.style.color=\'#aaa\'" onclick="rst()">重新开始探索</button>';document.body.appendChild(d)}

// 统计弹窗
function showStat(type){
  var s=gsGet(),tt='',bd='';
  if(type==='ends'){
    tt='达成结局 ('+s.ends.length+'/8)';
    ['幸运的你','反抗者','新管理员','瞬间被擒','被困者','逃离','真正的胜利'].forEach(function(e){bd+='<div style="font-size:1rem;margin:8px;color:'+(s.ends.indexOf(e)>=0?'#e8c070':'#333')+'">'+(s.ends.indexOf(e)>=0?'已解锁':'未解锁')+' — '+e+'</div>'});
  }else{
    tt='收集物品 ('+s.items.length+'件)';
    if(s.items.length===0)bd='<div style="color:#555">尚未收集任何物品</div>';
    else s.items.forEach(function(e){bd+='<div style="color:#e8c070;font-size:.9rem;margin:6px">'+e+'</div>'});
  }
  mOpen(tt,null,[bd.replace(/<[^>]*>/g,'')],[{t:'关 闭',a:function(){mClose()}}]);
  // 手动注入HTML（保留颜色）
  document.getElementById('MD').querySelector('.mb').innerHTML=bd;
}

function act(id){
  if(id==='desk')id='monitor';
  var a={monitor:function(){if(GS.phase===0){GS.phase=1;save();mOpen('新邮件',AI.forum,['你嘴里一股泥土的腥味。手指甲缝里塞满了黑褐色的碎屑。','电脑已经开着。邮件已经打开。发件人空缺。','<span class="hl">「你已经被邀请了。凌晨三点见。」</span>','发送时间：2003年3月3日。屏幕暗下去的瞬间——反光里看到身后站着一个人。','猛地回头——什么都没有。但旁边那把椅子是温的。'],[{t:'点击链接',a:function(){mClose();FX('flash');GS.fl.mirrorTask=true;save();loadRoom();N('屏幕黑了。暗红色的字洇出来。','r');N('「三更之约。在线人数：13。」','r');N('管理员第一条帖：<span class="hl">第一场游戏——镜中人。</span>','r');N('规则：凌晨三点，关灯，面对镜子，念三遍自己的名字。');N('三号成员：「她在我房间里——」消息断在03:03:03。','r');H('去浴室——站在镜子前完成游戏');TP('凌晨 2:59');addInv('指缝碎屑','手指缝里抠出的腐殖土——不记得碰过')}}])}else if(GS.md&&!GS.kd){var clues=0;if(GS.cf)clues++;if(GS.sf)clues++;if(GS.sof)clues++;if(GS.ph)clues++;if(GS.ff)clues++;if(GS.fl.trunkF)clues++;if(GS.fl.boxesF)clues++;if(clues<2){N('论坛上还没有新帖子。在屋子里多找找线索。');H('多找找线索——至少找到2个关键线索')}else{GS.fl.doorTask=true;save();N('论坛刷新。管理员新帖：<span class="hl">「第二场游戏——开门。」</span>','r');N('四号成员：「不要开。它在我门口。透过猫眼看到它也在往里看。」头像变黑。');H('去走廊——站在大门前。别从猫眼看。');}}else if(GS.kd&&!GS.fl.ended){GS.fl.sevenTask=true;save();mOpen('最后的私信',AI.forum,['论坛只剩你和七号。其他人——灰色的头像。','七号私信：<span class="hl">「林霄——我在公寓外面。出来见我。」</span>','她的措辞太冷静了。不像一个被吓得半死的人。','走廊里有大门。或者——你可以留在家里。'],[{t:'去走廊——见七号',a:function(){mClose();H('去走廊——打开大门见七号');N('七号在大门外等你。','r')}},{t:'留在家里——哪都不去',a:function(){mClose();endScr('幸运的你','你没有去见七号。第二天太阳照常升起——论坛消失了。但你知道，有些东西只是在等下一个凌晨三点。')}},{t:'回复邮件痛骂管理员',a:function(){mClose();endScr('反抗者','你疯狂敲击键盘，发送。屏幕闪烁——论坛消失了。但第二天，警察在公寓里发现了烧毁的电脑——和一张写满「对不起」的便签。')}}]);if(GS.sof&&GS.ph&&!GS.fl.sevenHint){GS.fl.sevenHint=true;save();N('等一下——日记和那个电话。是<span class="hl">七号。</span>她不是受害者——是招募者。','r')}}else{N('电脑屏幕亮着。你不敢看暗下去的屏幕反光。')}},
  bed:function(){N('被子湿透了——冷汗。不是体温能解释的冷。','r');N('另一个枕头有凹痕。枕下摸到一撮湿漉漉的黑发——不是你的。','r');FX('shake')},
  closet:function(){if(!GS.cf){GS.cf=true;save();N('柜门吱呀开了。最深处——纸条被钉在木板上。钉子是一枚带血槽的人指甲。','r');N('<span class="hl">「不要玩第二场游戏。不要开门。它一旦进来就不会走了。永远。」</span>纸上沾满干血。','r');addInv('钉着的纸条','被一片人指甲钉在衣柜深处的警告')}else{N('柜门虚掩着。里面有什么在轻轻刮木头。','r');FX('shake')}},

  floor:function(){N('踩到松动地板。缝隙里有张折得很小的纸。手绘楼层图。旁边写着：<span class="hl">「最深处。答案在最深处。」</span>','r')},

  mirror:function(){if(GS.fl.mirrorTask&&!GS.md){mOpen('镜中人',AI.mirror,['关灯。黑暗吞没一切——只有镜子是个稍浅的方块。','盯着里面的眼睛——那不是倒影该有的眼神。','念名字。一遍。两遍。三遍。嘴唇停下来了——','<span class="hl">镜子里的那张嘴还在动。</span>在说什么你没说出口的话。','凑近——它在尖叫。无声地。指甲抠在玻璃内侧刮出白痕。','镜子里那双手从里面往外推。骨节突出。掌心朝外——掌心上有眼睛。'],[{t:'尖叫后退',a:function(){mClose();GS.md=true;save();FX('flash');N('摔倒在浴室地板上。瓷砖是湿的——不是水。','r');N('回到电脑前——一号头像黑了。最后消息：<span class="hl">「她在我床下。她在看我。她在我嘴里。」</span>','r');H('回卧室看电脑');TP('凌晨 3:04');addInv('镜中笔记','第一场游戏的笔记。上面有不明水渍')}},{t:'伸手摸镜子',a:function(){mClose();GS.md=true;save();FX('shake');N('指尖碰到玻璃——不是冷的。37度。镜子里唇语：<span class="hl">「你已经在里面了。」</span>','r');H('回卧室看电脑');TP('凌晨 3:04');addInv('镜中笔记','第一场游戏的笔记。上面有不明水渍')}}])}else if(GS.md){N('瞥了一眼镜子。倒影还在看你。在默念你的名字。','r')}else{N('镜子里你的倒影——黑眼圈很重。倒影比你提前眨了眼睛。','r')}},
  sink:function(){N('拧开水龙头——深红色液体。温热的。粘稠的。关上。掌心多了一道细小伤口。','r')},
  shower:function(){N('拉开浴帘——下水口堵着一大团湿漉漉的黑发。扯不动。深处传来闷响。','r');FX('shake')},
  cabinet:function(){N('打开储物柜。一瓶安眠药——空的。三十片。药瓶下面压着纸：<span class="hl">「别睡。你一睡它就会进来。已经挺了七天。」</span>','r');addInv('药瓶和纸条','空安眠药瓶，下面压着你自己的笔迹')},
  toilet:function(){N('掀开马桶盖——水里有什么在晃动。黑色的。像头发——在水面下缓缓游动。','r')},
  drain:function(){N('地上的排水口。一撮头发堵在里面——还在往下水道里慢慢缩。','r')},
  towel:function(){N('毛巾是湿的。但今天还没洗过澡。背面沾着很淡的粉红色。','r')},
  frontdoor:function(){var u=GS.fl.doorTried;if(GS.fl.doorTask&&!GS.kd&&!u){GS.fl.doorTried=true;save();mOpen('开门',AI.door,['凌晨三点三十三分。手放到门把手上——把手是温的，湿的。','打开门。走廊一片漆黑。脚步声——湿漉漉的拍打声。','在你门口停住。<span class="hl">咚。</span>','一滴温热的液体落在肩膀上。又滴了一滴。在头顶。'],[{t:'抬头看',a:function(){mClose();GS.kd=true;save();FX('flash');N('天花板上——一对湿脚印。倒悬着往房间方向延伸。进入床底。','r');N('床单在动——下面有东西盯着你。两个亮点在眨。','r');H('回卧室看电脑');addInv('湿足迹','天花板上倒悬的湿脚印，延伸进了床底')}},{t:'关门',a:function(){mClose();GS.kd=true;save();FX('shake');N('猛摔上门。敲门声疯了。抵住——停了。猫眼——纯黑。巨大眼球移过来——虹膜白的瞳孔红的。','r');N('门缝下塞进纸条和一片指甲：<span class="hl">「它已经在里面了。一直都在。」</span>','r');H('回卧室看电脑');addInv('塞进门的纸条','一片指甲和一张纸条：它已经在里面了。一直都在')}}])}else if(GS.kd&&GS.fl.sevenTask){N('七号就在这扇门的外面。她在等你。','r');H('开门还是回家？');var b1=document.createElement('button');b1.className='mbtn';b1.textContent='打开门——去见七号';b1.style.margin='4px';b1.onclick=function(){document.getElementById('SC').innerHTML='';chaseDialog()};var b2=document.createElement('button');b2.className='mbtn';b2.textContent='转身回家';b2.style.margin='4px';b2.onclick=function(){endScr('幸运的你','你转身离开。第二天太阳照常升起。');};document.getElementById('NR').appendChild(b1);document.getElementById('NR').appendChild(b2)}else if(u){N('站到门前——门把手自己在轻轻转动。停了。又开始。','r')}else{N('大门。门锁完好。门下缝隙慢慢渗进一小滩深色液体。','r')}},

  sofa:function(){if(!GS.sof){GS.sof=true;save();N('沙发垫子下面——一本日记。封面上是你的名字。去年。','r');N('<span class="hl">「第三天。有一个叫七号的人联系了我。她问我能不能加入。」「她不是受害者。她是招募者。」</span>','r');addInv('旧日记','去年日记。记录了被七号召募的经历')}else{N('沙发上有个凹陷——人的形状。但没有人。')}},
  phone:function(){if(!GS.ph){GS.ph=true;save();N('老式座机。拿起听筒——拨号音。夹杂着呼吸声。');N('<span class="hl">「你是第十三号。七号会来接你的。她每次都来接。」</span>挂断。','r')}else{N('电话线被拔了。但拿起听筒——还是有拨号音。还是有人在笑。')}},

  curtain:function(){N('厚重的窗帘。路灯全灭了。街对面的窗户里亮了一下。有人在看你。','r')},
  rug:function(){if(!GS.fl.rugF){GS.fl.rugF=true;save();N('掀开地毯一角——地板上有深深的抓痕。像人用指甲抠的。','r');addInv('地板抓痕','地毯下的抓痕')}else{N('地毯盖着抓痕。没有掀开它。')}},
