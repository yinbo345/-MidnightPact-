<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>冥婚之约 — GhostBride</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700;900&family=Ma+Shan+Zheng&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0604;--red:#8b0000;--gold:#c8a050;--wood:#3a2010;--paper:#d4c8b0;--ink:#2a1a10;--fog:rgba(200,180,160,.06)}
body{background:#000;color:var(--paper);font-family:'Noto Serif SC',SimSun,serif;height:100vh;overflow:hidden;user-select:none}
#app{width:100vw;height:100vh;position:relative;overflow:hidden;background:var(--bg)}

/* ============ 场景层 ============ */
#scene{position:absolute;top:0;left:0;width:100%;height:calc(100% - 200px);transition:opacity 1s}
.sv{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity 1.2s;pointer-events:none}
.sv.active{opacity:1;pointer-events:auto}

/* 热区 */
.hot{position:absolute;cursor:pointer;transition:all .4s;z-index:5}
.hot:hover{filter:brightness(1.4) drop-shadow(0 0 8px rgba(200,150,50,.5))}
.hot::after{content:attr(data-hint);position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:.7rem;color:rgba(200,150,80,.6);white-space:nowrap;opacity:0;transition:opacity .3s;letter-spacing:.1em}
.hot:hover::after{opacity:1}

/* ============ 底部UI ============ */
#ui{position:absolute;bottom:0;left:0;width:100%;height:200px;z-index:20;pointer-events:none}
#ui>*{pointer-events:auto}

#dlg_bar{position:absolute;bottom:160px;left:0;width:100%;background:linear-gradient(0deg,rgba(5,3,2,.95),rgba(5,3,2,.7) 60%,transparent);padding:20px 100px 15px 40px;min-height:40px;transition:opacity .5s}
.dlg_spk{font-size:.75rem;color:#8b4513;letter-spacing:.25em;margin-bottom:4px}
.dlg_txt{font-size:1.05rem;line-height:1.9;color:var(--paper);text-shadow:0 0 3px rgba(200,150,50,.2);max-width:700px}
.dlg_txt em{color:#c0392b;font-style:normal;font-weight:bold}

#portrait{position:absolute;bottom:140px;right:40px;width:90px;height:120px;z-index:21;opacity:0;transition:opacity .5s}
#portrait.show{opacity:1}
#portrait div{width:100%;height:100%;border:1px solid #3a2010;background:linear-gradient(180deg,#1a0a05,#0a0302);border-radius:4px;overflow:hidden}

#choices_bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:22}
.ch_btn{font-family:inherit;font-size:.9rem;padding:12px 28px;background:rgba(15,6,3,.9);border:1px solid #3a2010;color:var(--paper);cursor:pointer;transition:all .35s;letter-spacing:.08em;white-space:nowrap}
.ch_btn:hover{background:rgba(60,15,8,.95);border-color:#8b4513;color:#e8c070;box-shadow:0 0 20px rgba(139,69,19,.3)}

/* 物品栏 */
#inv_bar{position:absolute;top:10px;right:15px;z-index:25;display:flex;gap:6px}
.inv_item{width:44px;height:44px;background:rgba(10,5,2,.8);border:1px solid #3a2010;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:rgba(200,150,80,.6);transition:all .3s;position:relative}
.inv_item:hover{border-color:#8b4513;color:#e8c070}
.inv_item.has{background:rgba(30,10,5,.9);border-color:#6a3018;color:var(--gold)}
.inv_item.has::before{content:attr(data-icon);font-size:1.1rem}
.inv_item .tip{display:none;position:absolute;bottom:50px;left:50%;transform:translateX(-50%);background:rgba(5,3,2,.95);border:1px solid #3a2010;padding:6px 12px;font-size:.7rem;white-space:nowrap;color:var(--paper)}
.inv_item:hover .tip{display:block}

/* 场景标题 */
#room_name{position:absolute;top:14px;left:20px;font-size:1.6rem;font-weight:900;color:rgba(180,40,30,.5);letter-spacing:.4em;z-index:15;pointer-events:none;text-shadow:0 0 20px rgba(180,20,20,.2)}

/* 特效 */
.fog_layer{position:absolute;top:0;left:0;width:200%;height:100%;pointer-events:none;z-index:3;opacity:.12;animation:fogDrift 20s linear infinite}
@keyframes fogDrift{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.firefly{position:absolute;width:3px;height:3px;background:rgba(255,200,100,.6);border-radius:50%;pointer-events:none;z-index:4;animation:ff 3s ease-in-out infinite;box-shadow:0 0 6px rgba(255,180,60,.4)}
@keyframes ff{0%,100%{opacity:.3;transform:translate(0,0)}50%{opacity:1;transform:translate(10px,-8px)}}

#fade{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;background:#000;pointer-events:none;opacity:0;transition:opacity 1s}
#fade.on{opacity:1}

/* 标题画面 */
#title{position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;background:radial-gradient(ellipse at 50% 65%,#1a0804,#020000 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#title .t_tit{font-family:'Ma Shan Zheng','Noto Serif SC',cursive;font-size:clamp(4rem,10vw,7rem);color:var(--red);letter-spacing:.3em;text-shadow:0 0 80px rgba(139,0,0,.6),0 0 160px rgba(80,0,0,.4);animation:tp 3s ease-in-out infinite}
@keyframes tp{0%,100%{text-shadow:0 0 80px rgba(139,0,0,.6)}50%{text-shadow:0 0 120px rgba(220,20,20,.9),0 0 240px rgba(120,0,0,.6)}}
.t_btn{font-family:inherit;font-size:1rem;padding:14px 50px;background:rgba(139,0,0,.05);border:1px solid #622;color:#aaa;cursor:pointer;letter-spacing:.25em;transition:all .4s;min-width:240px;text-align:center}
.t_btn:hover{border-color:#c22;color:#fff;background:rgba(180,0,0,.15);box-shadow:0 0 35px rgba(200,0,0,.3)}
.t_btn.sm{font-size:.78rem;padding:8px 20px;min-width:auto;border-color:#222;color:#555}
.t_btn.sm:hover{border-color:#a33;color:#888;background:transparent;box-shadow:none}

/* 结局 */
#ending{position:absolute;top:0;left:0;width:100%;height:100%;z-index:200;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px}
#ending .en_t{font-size:2.8rem;font-weight:900;color:var(--red);letter-spacing:.3em;text-shadow:0 0 50px rgba(200,0,0,.5)}
#ending .en_d{font-size:1rem;color:#888;max-width:500px;text-align:center;line-height:2.2}

/* 收集 */
#collect{position:absolute;top:0;left:0;width:100%;height:100%;z-index:150;background:rgba(0,0,0,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#collect h2{font-size:1.6rem;color:var(--red);letter-spacing:.3em}
#collect .ci{font-size:.9rem;margin:4px;transition:color .3s}
#collect .ci.got{color:var(--gold)}
#collect .ci.not{color:#333}
</style></head><body>
<div id="app">
  <!-- 场景容器 -->
  <div id="scene"></div>
  <div id="room_name"></div>
  <div id="inv_bar"></div>
  <div id="portrait"><div></div></div>
  <div id="dlg_bar"><div class="dlg_spk"></div><div class="dlg_txt"></div></div>
  <div id="choices_bar"></div>
  <div id="fade"></div>
  
  <!-- 标题画面 -->
  <div id="title">
    <div class="t_tit">冥婚之约</div>
    <div style="font-size:.85rem;color:#555;letter-spacing:.5em;margin-bottom:30px">G H O S T · B R I D E</div>
    <div style="font-size:.9rem;color:#666;margin-bottom:10px">民国三十七年 · 深山 · 青石村</div>
    <button class="t_btn" onclick="newGame()">开 始 探 索</button>
    <button class="t_btn sm" onclick="continueGame()" id="btn_cont" style="display:none">继 续</button>
    <div style="display:flex;gap:12px;margin-top:10px">
      <button class="t_btn sm" onclick="showCollect()">收 集 品</button>
      <button class="t_btn sm" onclick="showEnds()">已 解 锁</button>
    </div>
  </div>
  
  <!-- 结局 -->
  <div id="ending"><div class="en_t" id="en_title"></div><div class="en_d" id="en_desc"></div><button class="t_btn" onclick="backToTitle()">返 回</button></div>
  
  <!-- 收集 -->
  <div id="collect"><h2 id="coll_title"></h2><div id="coll_body"></div><button class="t_btn sm" onclick="document.getElementById('collect').style.display='none'">关 闭</button></div>
</div>
<script>
// ==================== 引擎 ====================
const $=id=>document.getElementById(id);
const sc=$('scene'), rn=$('room_name'), dlg=$('dlg_bar'), dspk=$('dlg_bar .dlg_spk');
const dtxt=$('dlg_bar .dlg_txt'), ch=$('choices_bar'), pt=$('portrait'), invb=$('inv_bar'), fade=$('fade');

let GS={room:'',phase:0,inv:[],flags:{}};
let cbs=[],cbI=0; // 对话回调节点

// 存档
function save(){try{localStorage.setItem('ghostbride2',JSON.stringify(GS))}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem('ghostbride2'));if(d)GS=d;return!!d}catch(e){return false}}

// 物品
function addItem(n,d,icon){if(!GS.inv.find(i=>i.n===n)){GS.inv.push({n,d,icon});save();refInv()}}
function hasItem(n){return GS.inv.some(i=>i.n===n)}
function refInv(){
  invb.innerHTML='';
  GS.inv.forEach(i=>{
    let el=document.createElement('div');el.className='inv_item has';
    el.setAttribute('data-icon',i.icon||'◆');el.title=i.d;
    let tip=document.createElement('div');tip.className='tip';tip.textContent=i.n;
    el.appendChild(tip);invb.appendChild(el)
  });
  for(let n=GS.inv.length;n<8;n++){let el=document.createElement('div');el.className='inv_item';el.textContent='-';invb.appendChild(el)}
}

// 对话
function speak(s,t,cb){
  pt.classList.add('show');pt.querySelector('div').style.background=s||'linear-gradient(180deg,#1a0a05,#0a0302)';
  dspk.textContent=t||'';dtxt.textContent='';cbI=0;
  dtxt.textContent='';dspk.textContent=t||'';
  let full=s;typeText(cb);
}
let typeTimer;
function typeText(cb){
  let txt=cbs[cbI]||'';
  if(!txt){cbs=[];if(cb)cb();return}
  cbs.splice(0,1);dtxt.innerHTML=txt;
  if(cbs.length===0){if(cb)cb();return}
  // 等用户点击
}
// 简化：一次显示一行
function dl(t,cb){cbs.push(t);dlg.style.opacity='1';scheduleShow(cb)}
function dl2(spkName,portraitStyle,t,cb){
  pt.classList.add('show');pt.querySelector('div').style.background=portraitStyle||'linear-gradient(180deg,#1a0a05,#0a0302)';
  dspk.textContent=spkName||'';dtxt.innerHTML=t;dlg.style.opacity='1';
  if(cb)cb()
}

let showTimer;
function showText(){
  if(cbs.length===0)return;
  let t=cbs.shift();dtxt.innerHTML=t;clearTimeout(showTimer);
  if(cbs.length===0)dlg.style.opacity='.7'
}
function scheduleShow(cb){
  showText();
  if(cbs.length===0&&cb)setTimeout(cb,500)
}
// 简化：dl3
function dl3(spk,style,texts,cb){
  dspk.textContent=spk||'';pt.classList.add('show');pt.querySelector('div').style.background=style||'linear-gradient(180deg,#1a0a05,#0a0302)';
  dlg.style.opacity='1';
  let i=0;
  function next(){if(i>=texts.length){if(cb)cb();return}dtxt.innerHTML=texts[i];i++;setTimeout(next,texts[i-1].length*45+600)}
  next()
}

// 选项
function ask(opts,cb){
  ch.innerHTML='';
  opts.forEach((o,i)=>{
    let b=document.createElement('button');b.className='ch_btn';b.textContent=o.l||o;
    b.onclick=()=>{ch.innerHTML='';cb(i)}
    ch.appendChild(b)
  })
}

// 特效
function fadeIn(cb){fade.classList.add('on');setTimeout(()=>{if(cb)cb();setTimeout(()=>fade.classList.remove('on'),100)},800)}
function fadeOut(cb){fade.classList.remove('on');setTimeout(()=>{if(cb)cb()},800)}

// 结局
function ending(t,d){
  save();
  try{let e=JSON.parse(localStorage.getItem('gb_e2')||'[]');if(!e.includes(t)){e.push(t);localStorage.setItem('gb_e2',JSON.stringify(e))}}catch(e){}
  try{let ci=JSON.parse(localStorage.getItem('gb_i2')||'[]');GS.inv.forEach(i=>{if(!ci.includes(i.n))ci.push(i.n)});localStorage.setItem('gb_i2',JSON.stringify(ci))}catch(e){}
  $('ending').style.display='flex';$('en_title').textContent=t;$('en_desc').textContent=d
}
function backToTitle(){
  $('ending').style.display='none';$('title').style.display='flex';
  GS={room:'',phase:0,inv:[],flags:{}};save()
}

// ==================== 场景 ====================
let curScene='';

function loadScene(id){
  curScene=id;sc.innerHTML='';ch.innerHTML='';rn.textContent='';
  let sv=document.createElement('div');sv.className='sv';sv.id='sv_'+id;sc.appendChild(sv);
  setTimeout(()=>sv.classList.add('active'),50);
  buildScene(id,sv);
}

function buildScene(id,sv){
  switch(id){
    case 'entrance': scene_entrance(sv);break;
    case 'hall': scene_hall(sv);break;
    case 'mansion': scene_mansion(sv);break;
    case 'mountain': scene_mountain(sv);break;
    case 'cave': scene_cave(sv);break;
    case 'chamber': scene_chamber(sv);break;
  }
  addFireflies(sv);
}

function addFireflies(sv){
  for(let i=0;i<8;i++){
    let f=document.createElement('div');f.className='firefly';
    f.style.left=(5+Math.random()*90)+'%';f.style.top=(10+Math.random()*80)+'%';
    f.style.animationDelay=(Math.random()*3)+'s';f.style.animationDuration=(2+Math.random()*4)+'s';
    sv.appendChild(f)
  }
}

function hot(el,x,y,w,h,hint,onclick){
  el.style.cssText+='left:'+x+'%;top:'+y+'%;width:'+w+'%;height:'+h+'%';
  el.className+=' hot';el.setAttribute('data-hint',hint);
  el.onclick=onclick
}

// ==================== 场景绘制 ====================
function addFog(sv){
  let f=document.createElement('div');f.className='fog_layer';
  f.style.background='radial-gradient(ellipse at 30% 80%,rgba(180,160,140,.15),transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(160,140,120,.1),transparent 50%)';
  sv.appendChild(f)
}

// 村口
function scene_entrance(sv){
  rn.textContent='青石村 · 村口';
  sv.style.background='linear-gradient(180deg,#0a0806 0%,#151008 30%,#1a120a 60%,#0d0804 100%)';
  addFog(sv);
  // 天空
  let sky=div(sv,'0;0;100;35','background:linear-gradient(180deg,#1a1210,#0a0806)');
  // 山
  let mt=div(sv,'0;22;100;25','background:linear-gradient(180deg,#151210,#0d0a06);border-radius:0 0 50% 50%');
  // 月亮
  let moon=div(sv,'72;5;5;7','background:radial-gradient(circle,rgba(200,180,140,.4),transparent 70%);border-radius:50%;box-shadow:0 0 30px rgba(200,180,140,.15)');
  // 槐树
  let tree=div(sv,'12;18;14;40','');
  tree.innerHTML='<div style="width:6px;height:100%;background:linear-gradient(180deg,#1a1008,#0d0604);margin:0 auto;border-radius:3px"></div><div style="position:absolute;top:-10px;left:-20px;width:60px;height:60px;background:radial-gradient(ellipse at 50% 60%,#0a0604,#060302);border-radius:50%;box-shadow:0 0 15px rgba(0,0,0,.5)"></div>';
  // 红布条
  for(let i=0;i<4;i++){let r=div(sv,(10+Math.random()*10)+';'+(30+Math.random()*20)+';2;5','background:rgba(120,20,15,.4);transform:rotate('+(Math.random()*20-10)+'deg)')}
  // 石碑
  let st=div(sv,'38;50;8;16','background:linear-gradient(180deg,#2a1e14,#1a1008);border-radius:4px;box-shadow:0 0 8px rgba(0,0,0,.5)');
  hot(st,'38','50','8','16','村碑',()=>entranceStone());
  // 告示牌
  let sign=div(sv,'62;38;10;22','background:linear-gradient(180deg,#3a2818,#1a1008);border:2px solid #2a1a0a;border-radius:3px');
  let sp=div(sign,'5;30;90;65','background:rgba(180,150,120,.1);border:1px solid rgba(180,150,120,.2)');
  hot(sign,'62','38','10','22','告示牌',()=>entranceNotice());
  // 路
  let road=div(sv,'25;68;50;32','background:rgba(20,15,10,.4);clip-path:polygon(30% 0,70% 0,90% 100%,10% 100%)');
  // 村子远景
  let vil=div(sv,'35;25;30;25','');
  for(let i=0;i<5;i++){div(vil,(i*20)+';40;15;60','background:rgba(10,6,4,'+(.3+Math.random()*.5)+');border-radius:3px 3px 0 0')}
  // 老槐树热区
  let th=div(sv,'5;15;25;50','');hot(th,'5','15','25','50','老槐树',()=>entranceTree());
}

function entranceStone(){dl3('',null,['一块老旧的石碑。三个大字——青石村。','下面一行小字：「建于明万历年间。林氏宗族聚居地。」','碑座上有新鲜的红色手印——小的。女人的。'],()=>{GS.flags.monument=true;save()})}
function entranceNotice(){dl3('',null,['一张发黄的告示：','「本村林氏第三十三代嫡女林婉儿，于民国三十六年三月三日，嫁与冥府。」','告示边缘有一行新墨：「她还在等你。」'],()=>{addItem('林氏告示','记载了林婉儿冥婚的告示','📜');GS.flags.notice=true;save()})}
function entranceTree(){
  if(GS.flags.tree){dl3('',null,['槐树依然立在那里。红布条在风中沙沙作响——像无数只手在摆动。']);return}
  GS.flags.tree=true;save();
  dl3('',null,['这棵槐树太大了。树冠遮住了半边天。','树干上缠满了褪色的红布条。每一条上都写着女人的名字——旁边系着一枚铜钱。','你取下一条——上面写着「林婉儿」。'],()=>{addItem('褪色红布条','从老槐树上取下的红布条，写着林婉儿的名字','🎀')})
}

// 祠堂
function scene_hall(sv){
  rn.textContent='林氏祠堂';
  sv.style.background='linear-gradient(180deg,#060302 0%,#0a0603 50%,#0d0804 100%)';
  let fl=div(sv,'0;0;100;100','background:radial-gradient(ellipse at 50% 80%,rgba(180,120,60,.08),transparent 60%),radial-gradient(ellipse at 30% 30%,rgba(200,100,40,.05),transparent 50%)');
  // 烛光
  for(let i=0;i<3;i++){div(sv,(20+i*30)+';55;4;10','background:radial-gradient(ellipse at 50% 80%,rgba(200,120,30,.25),transparent 70%);border-radius:50%')}
  // 牌位架
  let shelf=div(sv,'25;10;50;40','background:linear-gradient(180deg,#1a0e06,#0d0603);border:2px solid #2a1a0a;border-radius:5px;box-shadow:inset 0 0 20px rgba(0,0,0,.5)');
  for(let r=0;r<4;r++){div(shelf,'5;'+(5+r*23)+';90;18','background:rgba(30,15,8,.8);border-bottom:1px solid #3a2010')}
  // 空位高亮
  let empty=div(shelf,'60;52;35;40','background:rgba(100,30,20,.1);border:1px dashed rgba(180,60,30,.2)');
  hot(empty,'25','10','50','40','祖先牌位',()=>hallTablets());
  // 供桌
  let desk=div(sv,'30;75;40;20','background:linear-gradient(180deg,#2a1a0e,#1a0e06);border-radius:4px;box-shadow:0 4px 8px rgba(0,0,0,.4)');
  hot(desk,'30','75','40','20','供桌',()=>hallDesk());
  // 香炉
  let incense=div(sv,'55;68;10;12','background:linear-gradient(180deg,#3a2818,#1a1008);border-radius:50% 50% 5px 5px');
  hot(incense,'55','68','10','12','香炉',()=>hallIncense());
  // 侧门
  let door=div(sv,'88;15;10;60','background:linear-gradient(180deg,#1a0e06,#0d0603);border:2px solid #2a1a0a;border-radius:3px 3px 0 0');
  hot(door,'88','15','10','60','祠堂侧门',()=>hallDoor());
}

function hallTablets(){
  if(GS.flags.tablets){dl3('',null,['牌位还在。最后一排空位还在。']);return}
  GS.flags.tablets=true;save();
  dl3('',null,['成排的牌位——从上到下，从明朝到现在。','最后一排有块空位。旁边刻着——「待嫁 · 林婉儿」。','冥婚的新娘牌位不应该进祠堂——除非她是以正妻的身份被迎娶的。'],()=>{addItem('祠堂手记','记录林婉儿以正妻身份入祠堂的笔记','📝')})
}
function hallDesk(){
  if(GS.flags.desk){dl3('',null,['供桌还在。香烛还在燃。腥味比上次更浓了。']);return}
  GS.flags.desk=true;save();
  dl3('',null,['供桌上摆着三牲——血还是湿的。桌角有张红纸——婚书。','婚书上写：「男方：冥府无名氏。女方：林婉儿。择三月三日寅时过门。」','背面：「聘礼——十三口棺木。十三枚铜钱。十三根红绳。」'],()=>{addItem('冥婚婚书','供桌上发现的婚书——男方名字被涂黑了','📄')})
}
function hallIncense(){
  if(hasItem('铜钱')){dl3('',null,['香炉里的香还在燃——但闻不到檀香味。只有腥味。']);return}
  dl3('',null,['香炉很大。铜制的。里面插满了香。你伸手进去——触到了冰凉的东西。','一枚铜钱。方孔。已经发绿了。但铜钱上有暗红色的渍迹——不是锈。'],()=>{addItem('铜钱','香炉里找到的铜钱，沾着暗红色渍迹','🪙')})
}
function hallDoor(){
  if(hasItem('铜钱')){
    dl3('',null,['侧门上贴着一张符纸。你把铜钱按在符纸上——','门发出低沉的吱呀声。开了。门后是一条黑暗的走廊——通往老宅。'],()=>{
      ask([{l:'走进老宅'},{l:'回头'}],i=>{if(i===0){fadeIn(()=>{GS.room='mansion';loadScene('mansion');fadeOut()})}})
    })
  }else dl3('',null,['一扇侧门。上面贴着一张符纸——墨迹还是湿的。需要什么东西来开门。'])
}

// 老宅

  rn.textContent='林家老宅';
  sv.style.background='linear-gradient(180deg,#080402 0%,#0d0603 50%,#100804 100%)';
  // 灯笼
  for(let i=0;i<3;i++){
    let l=div(sv,(20+i*30)+';5;8;14','background:radial-gradient(ellipse at 50% 40%,rgba(200,30,20,.5),rgba(100,10,5,.2));border-radius:50%;box-shadow:0 0 25px rgba(180,20,10,.3)')
    div(l,'25;0;50;100','background:rgba(200,30,20,.1)')
  }
  // 大门
  let gate=div(sv,'5;15;25;60','background:linear-gradient(180deg,#1a0e06,#0d0603);border:2px solid #3a2010;border-radius:5px 0 0 0');
  let gopen=div(gate,'5;5;90;50','background:rgba(200,100,40,.05);border:1px solid rgba(200,100,40,.1)');
  hot(gate,'5','15','25','60','大门口',()=>mansionGate());
  // 院子
  let yd=div(sv,'5;75;45;25','background:rgba(20,12,8,.5);border-top:1px solid rgba(80,40,15,.3)');
  // 花轿
  let sedan=div(yd,'30;10;40;80','background:linear-gradient(180deg,rgba(100,15,10,.5),rgba(60,8,4,.3));border:2px solid rgba(120,20,10,.3);border-radius:8px');
  hot(sedan,'30','10','40','80','院子 · 花轿',()=>mansionCourtyard());
  // 堂屋
  let hall=div(sv,'32;18;30;40','background:linear-gradient(180deg,#1a0e06,#0d0603);border:2px solid #2a1a0a;border-radius:5px');
  hot(hall,'32','18','30','40','堂屋',()=>mansionHall());
  // 东厢房
  let east=div(sv,'65;25;18;40','background:linear-gradient(180deg,#1a0e06,#0d0603);border:2px solid #3a2010;border-radius:5px');
  hot(east,'65','25','18','40','东厢房',()=>mansionEast());
  // 婚房
  let wedding=div(sv,'10;25;16;40','background:linear-gradient(180deg,rgba(80,10,5,.5),rgba(40,5,2,.3));border:2px solid rgba(120,15,8,.3);border-radius:5px;box-shadow:0 0 15px rgba(150,20,10,.2)');
  hot(wedding,'10','25','16','40','婚房',()=>mansionWedding());
}

function mansionGate(){
  if(!GS.flags.mgate){GS.flags.mgate=true;save()
    dl3('',null,['大门虚掩着。门缝里透出红色灯笼的光。推开大门——院子里空荡荡的。正中央摆着一顶花轿。轿帘在动。但外面没有风。'])}
  else dl3('',null,['花轿还在。轿帘还在动。这次你看到了——轿帘下露出了一只绣花鞋。'])
}
function mansionCourtyard(){
  if(!GS.flags.courtyard){GS.flags.courtyard=true;save()
    dl3('',null,['院子里摆着一桌酒席——菜是热的。酒是温的。二十四个座位全是空的。','每个座位前都扣着一个碗——碗底朝上。这是给死人坐的席。'],()=>{addItem('宴席笔记','记录老宅鬼宴的笔记','🍶')})}
  else dl3('',null,['酒席还在。菜——还是热的。不是你离开的时间。'])
}
function mansionHall(){
  if(GS.flags.oldlady&&GS.flags.told){dl3('',null,['椅子空了。连照片都不在了。']);return}
  if(GS.flags.oldlady){dl3('',null,['「还是那句话——婉儿在等你。」']);return}
  GS.flags.oldlady=true;save();
  dl3('老太太','linear-gradient(180deg,#1a0a05,#0a0302)',['堂屋正中挂着林家祖先的画像。画像下面——一个老太太坐在太师椅上。背对着你。','「你来了。」她没回头。声音像枯叶摩擦。「婉儿等了好久了。」'],()=>{
    ask([{l:'走上前'},{l:'站在原地'}],i=>{
      if(i===0)dl3('',null,['你绕到前面——椅子上没有人。只有一张照片。老太太的照片——但照片里的眼睛在看着你。'])
      else{GS.flags.told=true;save();dl3('老太太','linear-gradient(180deg,#1a0a05,#0a0302)',['「你是谁？」「我是林家最后一个知道真相的人。去婚房吧——婉儿会告诉你一切的。」'])}
    })
  })
}
function mansionEast(){
  if(hasItem('林家日记')){dl3('',null,['日记还在桌上。但翻不开了——书页粘在一起。像被什么湿透又干了。']);return}
  dl3('',null,['东厢房很整洁。桌上摆着一本打开的日记——墨迹虽淡，还能辨认。','「三月一日。爹说给我找了一门好亲事。我问是谁——他不说。」','「三月三日——红色的轿子。里面没有人。但有新郎的袍服——平铺在座椅上。像躺着一个人。」','最后一页被撕掉了。'],()=>{addItem('林家日记','林婉儿生前的日记——最后一页被撕掉了','📖')})
}
function mansionWedding(){
  if(hasItem('林家日记')&&hasItem('红盖头')&&hasItem('红绳')&&hasItem('铜钱')){
    GS.room='chamber';
    fadeIn(()=>{loadScene('chamber');fadeOut()});return
  }
  let ms=[];
  if(!hasItem('林家日记'))ms.push('林家日记（东厢房）');
  if(!hasItem('红盖头'))ms.push('红盖头（山洞祭坛）');
  if(!hasItem('红绳'))ms.push('红绳（后山古墓）');
  if(!hasItem('铜钱'))ms.push('铜钱（祠堂香炉）');
  dl3('',null,['婚房的门口挂着一块红盖头。门缝里透出暗红色的光——里面有人影。你需要准备周全。','还需要：'+ms.join('、')])
}

// 后山
function scene_mountain(sv){
  rn.textContent='后 山';
  sv.style.background='linear-gradient(180deg,#0a0806 0%,#0d0a06 40%,#060403 100%)';
  addFog(sv);
  // 树
  for(let i=0;i<8;i++){div(sv,(i*13)+';'+(20+Math.random()*40)+';3;'+(30+Math.random()*40),'background:#0a0604;border-radius:2px')}
  // 山路
  let path=div(sv,'30;60;40;40','background:linear-gradient(180deg,rgba(20,15,10,.3),rgba(15,10,8,.2));clip-path:polygon(20% 0,80% 0,95% 100%,5% 100%)');
  hot(path,'30','60','40','40','山路',()=>mountainPath());
  // 古墓
  let tomb=div(sv,'60;30;18;35','background:linear-gradient(180deg,#1a1008,#0a0603);border-radius:5px 5px 0 0;box-shadow:0 0 12px rgba(0,0,0,.5)');
  hot(tomb,'60','30','18','35','古墓',()=>mountainTomb());
  // 山洞口
  let cave=div(sv,'5;40;18;35','background:radial-gradient(ellipse at 50% 30%,#060504,#020101);border-radius:50% 50% 0 0');
  hot(cave,'5','40','18','35','山洞口',()=>mountainCave());
}

function mountainPath(){GS.flags.footprints=true;save();dl3('',null,['山路越来越窄。石阶上长满了青苔。湿的脚印——赤足的。小的。往山上去了。'])}
function mountainTomb(){
  if(hasItem('红绳')){dl3('',null,['墓碑还在。红绳原来扎着的地方——渗出了暗红色的液体。']);return}
  dl3('',null,['一座古墓。「林氏冥婚合葬之墓」。下面两排名字——每个都只有嫁入冥府的年份。','墓碑前的石缝里露出一截红色的东西——你拽出来。一根红绳。打了死结。'],()=>{addItem('红绳','古墓前找到的红绳，打了死结','🧶')})
}
function mountainCave(){
  if(hasItem('红绳')){fadeIn(()=>{GS.room='cave';loadScene('cave');fadeOut()});return}
  dl3('',null,['一个黑漆漆的洞口。里面隐约传来唢呐声。需要红绳才能进入。'])
}

// 山洞
function scene_cave(sv){
  rn.textContent='山 洞';
  sv.style.background='radial-gradient(ellipse at 50% 60%,#0a0604,#020101 80%)';
  // 石壁
  let wall=div(sv,'0;60;30;40','background:linear-gradient(180deg,#0d0806,#060403);border-radius:0 20px 0 0');
  hot(wall,'0','60','30','40','洞壁刻字',()=>caveWall());
  // 石棺
  let coffin=div(sv,'40;65;30;30','background:linear-gradient(180deg,#1a1008,#0a0603);border-radius:8px 8px 0 0;box-shadow:inset 0 0 15px rgba(0,0,0,.6)');
  hot(coffin,'40','65','30','30','石棺',()=>caveCoffin());
  // 祭坛
  let altar=div(sv,'30;10;25;30','background:linear-gradient(180deg,#1a0e06,#0d0603);border-radius:5px;box-shadow:0 0 20px rgba(100,20,10,.15)');
  hot(altar,'30','10','25','30','祭坛',()=>caveAltar());
  // 滴水
  for(let i=0;i<5;i++){div(sv,(20+Math.random()*60)+';'+(30+Math.random()*50)+';1;3','background:rgba(100,140,160,.1)')}
}

function caveWall(){
  if(GS.flags.walltext){dl3('',null,['刻字还在。最下面一行字是新的：「你是下一个。」']);return}
  GS.flags.walltext=true;save();
  dl3('',null,['洞壁上刻满了字——指甲抠的。','「救我」「我不想嫁」「他每晚都来」「脸是空的」「轮到你了」——不同笔迹，同一个绝望。'])
}
function caveCoffin(){dl3('',null,['洞中央摆着一口石棺。棺盖被推开了。','里面铺着红色锦被。两个枕头——一个有凹痕。被子还是温的。'])}
function caveAltar(){
  if(hasItem('红盖头')){dl3('',null,['祭坛空了。但唢呐声还在响。很近。就在身后。']);return}
  dl3('',null,['祭坛上供奉着一块红布——嫁衣上的红盖头。金线绣着「囍」字。','拿起红盖头的瞬间——唢呐声响了。很近。在身后。转身——什么都没有。'],()=>{addItem('红盖头','从山洞祭坛取下的红盖头，金线绣囍字','👰')})
}

// 婚房
function scene_chamber(sv){
  rn.textContent='婚 房';
  sv.style.background='radial-gradient(ellipse at 50% 50%,#200a06,#050101 80%)';
  // 红烛
  for(let i=0;i<2;i++){let c=div(sv,(30+i*40)+';65;3;10','background:radial-gradient(ellipse at 50% 80%,rgba(200,80,20,.4),transparent 60%);border-radius:50%')}
  // 喜床
  let bed=div(sv,'20;40;40;45','background:linear-gradient(180deg,rgba(60,8,3,.6),rgba(30,3,1,.4));border:2px solid rgba(100,15,8,.4);border-radius:8px');
  hot(bed,'20','40','40','45','喜床',()=>chamberBed());
  // 梳妆台
  let dresser=div(sv,'65;30;18;40','background:linear-gradient(180deg,#1a0e06,#0a0502);border:2px solid #3a2010;border-radius:4px');
  hot(dresser,'65','30','18','40','梳妆台',()=>chamberDresser());
  // 嫁衣
  let gown=div(sv,'5;25;10;55','background:linear-gradient(180deg,rgba(120,10,5,.5),rgba(60,5,3,.3));border:1px solid rgba(140,15,8,.3)');
  hot(gown,'5','25','10','55','嫁衣',()=>chamberGown());
  // 最终互动
  let fin=div(sv,'60;10;30;20','');hot(fin,'60','10','30','20','红盖头',()=>chamberFinal());
}

function chamberBed(){GS.flags.sawdoll=true;save();dl3('',null,['喜床很大。红帐垂下。床上坐着一个人影——纸扎的新娘。脸上的胭脂猩红——嘴是用针缝着的。'])}
function chamberDresser(){
  if(!GS.flags.mirror){GS.flags.mirror=true;save();dl3('',null,['梳妆台很旧。铜镜蒙着一层灰。擦了一下——镜子里的倒影不是你的。是一个穿嫁衣的女人。在你身后。'])}
  else dl3('',null,['铜镜碎了——但你不记得打破过它。'])
}
function chamberGown(){
  if(!hasItem('嫁衣碎片')){dl3('',null,['嫁衣挂在衣架上——很美。金线、刺绣。但胸口有一个洞——被什么东西从里面捅穿的。'],()=>{addItem('嫁衣碎片','嫁衣上取下的布料——破洞边缘焦黑','🧵')})}
  else dl3('',null,['嫁衣还在。胸口的洞——好像比上次大了一点。'])
}
function chamberFinal(){
  if(!GS.flags.sawdoll){dl3('',null,['你还没准备好面对她——先看看喜床。']);return}
  if(!hasItem('林家日记')||!hasItem('红绳')||!hasItem('铜钱')){dl3('',null,['还需要更多准备——日记、红绳、铜钱。']);return}
  GS.phase=5;save();
  dl3('',null,['你把红盖头放在梳妆台上。红绳绕在手腕上。铜钱握在手心。日记翻到最后一页——','门关上了。烛火全灭。黑暗里——一只手搭上你的肩膀。冰的。小小的。女人的手。'],()=>{
    ask([{l:'转身面对她'},{l:'闭上眼睛'},{l:'冲出房间'}],finalChoice)
  })
}

function finalChoice(i){
  if(i===0){
    dl3('林婉儿','linear-gradient(180deg,rgba(80,10,5,.9),rgba(30,3,1,.7))',['她站在你面前——穿着嫁衣。脸被红盖头遮住。','「谢谢你愿意转身。」她的手很小。很冷。「他们把我嫁给了一个不存在的东西。用我的命换村子的庇护。」','「解开红绳。」她说。「解开——我就能走了。」'],()=>{
      ask([{l:'解开红绳'},{l:'绑紧红绳'}],j=>{
        if(j===0)ending('解 脱','你解开了红绳。她笑了——八十年来第一次有人帮她。红盖头飘落。天亮了。你在山下的旅馆醒来——手心里还残留着凉意。');
        else ending('守 约','你绑紧了红绳。她沉默了很久。红盖头下流出血来。整个房间开始震动。你逃出老宅——身后的村子燃烧着。但你活了下来。');
      })
    })
  }else if(i===1){
    dl3('林婉儿','linear-gradient(180deg,rgba(80,10,5,.9),rgba(30,3,1,.7))',['你闭上眼睛。耳边响起轻轻的歌声。不是活人能唱出来的调子。','「你怕我。」她说。不是责备——只是陈述。'],()=>{
      ask([{l:'睁开眼睛'},{l:'转身离开'}],j=>{
        if(j===0)ending('面 对','你睁开眼睛。她掀开了盖头。脸还在——不像鬼。像一个等太久了的姑娘。「外面的人终于来了。我等了八十年。」第二天你醒来在村口——口袋里一张婚书，背面写着「已解」。');
        else ending('逃 离','你转身冲出婚房。身后传来哭声——不是恐怖的，是伤心的。你跑出村子没有回头。五十年后——依然会在梦里听到歌声。');
      })
    })
  }else{
    if(hasItem('嫁衣碎片'))ending('真 相','你冲向房门——用嫁衣碎片堵住门缝。门外的力量推不开了。一声叹息。天亮时门自己开了——老宅空了。你的采访稿成了年度头条。');
    else ending('永 困','你冲向门——门纹丝不动。烛火全亮了。满屋子红色。转身——床上坐着十三个人。穿着嫁衣。一模一样的脸。都是林婉儿。她们同时开口：「留下来。」');
  }
}

// ==================== 工具 ====================
function div(parent,pos,style){
  let d=document.createElement('div');d.style.cssText='position:absolute;'+style;
  if(pos){let p=pos.split(';');d.style.left=p[0]+'%';d.style.top=p[1]+'%';d.style.width=p[2]+'%';d.style.height=p[3]+'%'}
  parent.appendChild(d);return d
}

// ==================== 游戏流程 ====================
function newGame(){
  GS={room:'',phase:0,inv:[],flags:{}};save();
  $('title').style.display='none';
  fadeIn(()=>{
    loadScene('entrance');
    dl3('',null,['民国三十七年。秋天。','你是一名报社记者。三天前收到一封匿名信——信里只有一张照片和一个地名。青石村。','你查了三天——关于青石村，几乎没有任何记录。只有一份两年前的新闻：青石村大火。村民全部失踪。','今天——你站在通往村子的山路上。晨雾很重。雾气里闻到了一股说不清的味道。像什么东西烧焦了——又像香烛。'],fadeOut)
  })
}

function continueGame(){
  if(!load())return;
  $('title').style.display='none';refInv();
  let rm=GS.room||'entrance';
  fadeIn(()=>{loadScene(rm);fadeOut()})
}

function showCollect(){
  let ci=JSON.parse(localStorage.getItem('gb_i2')||'[]');
  let all=['林氏告示','褪色红布条','祠堂手记','冥婚婚书','铜钱','宴席笔记','林家日记','红绳','红盖头','嫁衣碎片'];
  $('coll_title').textContent='收 集 品 ('+ci.length+'/10)';
  $('coll_body').innerHTML=all.map(i=>`<div class="ci ${ci.includes(i)?'got':'not'}">${ci.includes(i)?'✓':'○'} ${i}</div>`).join('');
  $('collect').style.display='flex'
}
function showEnds(){
  let ends=JSON.parse(localStorage.getItem('gb_e2')||'[]');
  let all=['解脱','守约','面对','逃离','真相','永困'];
  let desc={'解脱':'挣脱冥婚，放林婉儿自由','守约':'维持婚约，村子燃烧','面对':'正视她，收到已解的婚书','逃离':'逃出村子，一生遗憾','真相':'用嫁衣碎片争取时间','永困':'被困婚房，成为第十四个'};
  $('coll_title').textContent='已解锁 ('+ends.length+'/6)';
  $('coll_body').innerHTML=all.map(i=>`<div class="ci ${ends.includes(i)?'got':'not'}">${ends.includes(i)?'✓':'○'} ${desc[i]}</div>`).join('');
  $('collect').style.display='flex'
}

// 初始化
load();refInv();
if(GS.room)document.getElementById('btn_cont').style.display='inline-block';
</script></body></html>
